name: Snapshot Demo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run tests
        run: make test
      - name: Capture demo snapshot
        run: make snapshot
      - name: Upload UI snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-demo
          path: docs/ui-demo.txt
