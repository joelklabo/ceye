name: 📸 Snapshot - Demo Preview

on:
on:
  push:
    branches: [main]
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Install tmux
        run: |
          if ! command -v tmux &> /dev/null; then
            echo "tmux not found, installing..."
            brew install tmux
          else
            echo "tmux already installed"
          fi
      - name: Run tests
        run: make test
      - name: Capture demo snapshot
        run: make snapshot
      - name: Upload UI snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-demo
          path: docs/ui-demo.txt
