name: ✨ Code Quality - Lint & Format

on:
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: Go Linting
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=10m --verbose

  staticcheck:
    name: Static Analysis
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      
      - name: Run staticcheck
        run: staticcheck ./...

  go-fmt:
    name: Code Formatting
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Please run 'go fmt ./...'"
            gofmt -s -l .
            exit 1
          fi

  go-vet:
    name: Go Vet
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Run go vet
        run: go vet ./...

  deadcode:
    name: Dead Code Detection
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest
      
      - name: Check for dead code
        run: deadcode -test ./...

  coverage-report:
    name: Coverage Report
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Generate coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      
      - name: Coverage report
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage is below 70%"
            exit 1
          fi
          echo "✅ Coverage is ${COVERAGE}%"
      
      - name: Generate HTML report
        run: go tool cover -html=coverage.out -o coverage.html
      
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  test-coverage-comment:
    name: Comment Coverage on PR
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    needs: coverage-report
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Generate coverage
        run: go test -coverprofile=coverage.out ./...
      
      - name: Create coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage.out', 'utf8');
            const lines = coverage.split('\n');
            const totalLine = lines[lines.length - 2];
            const match = totalLine.match(/(\d+\.\d+)%/);
            const percent = match ? match[1] : 'unknown';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Test Coverage Report\n\nTotal coverage: **${percent}%**`
            });
